<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp (simulado)</title>
<style>
  :root { --bg:#0b0d12; --phone:#0b141a; --head:#1f2c34; --in:#202c33; --out:#005c4b; --txt:#e9edef; --sub:#8696a0; --acc:#00a884; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter","Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--txt);
         display:flex; justify-content:center; padding:24px 16px; }
  .phone { width:100%; max-width:400px; height:760px; background:var(--phone); border:1px solid #262a35;
           border-radius:28px; overflow:hidden; display:flex; flex-direction:column; }
  .head { background:var(--head); padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:var(--acc); display:grid; place-items:center;
            font-weight:700; font-size:.9rem; color:#fff; }
  .nombre { font-weight:600; font-size:.95rem; } .estado { font-size:.75rem; color:var(--sub); }
  .cfg { padding:10px 12px; background:#111b21; display:flex; gap:8px; }
  .cfg input { flex:1; }
  input { padding:10px 14px; border-radius:20px; border:0; background:var(--in); color:var(--txt); font-size:.9rem; outline:none; }
  button { border:0; border-radius:50%; width:42px; height:42px; background:var(--acc); color:#fff; cursor:pointer;
           display:grid; place-items:center; flex:0 0 42px; }
  button svg { width:18px; height:18px; }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:6px; }
  .vacio { margin:auto; color:var(--sub); font-size:.85rem; text-align:center; }
  .b { max-width:82%; padding:7px 10px 18px; border-radius:8px; font-size:.9rem; line-height:1.4; position:relative; }
  .assistant { align-self:flex-start; background:var(--in); }
  .user { align-self:flex-end; background:var(--out); }
  .hora { position:absolute; right:8px; bottom:3px; font-size:.65rem; color:var(--sub); }
  .nuevo { animation:entra .35s ease-out; }
  @keyframes entra { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .barra { padding:10px 12px; background:#111b21; display:flex; gap:8px; }
  .barra input { flex:1; }
  .escribiendo { font-size:.75rem; color:var(--acc); padding:0 16px 6px; min-height:1.2em; }
</style>
</head>
<body>
<div class="phone">
  <div class="head">
    <div class="avatar">AC</div>
    <div><div class="nombre">Atención al cliente</div><div class="estado">Cuenta verificada de empresa</div></div>
  </div>
  <div class="cfg">
    <input id="cedula" placeholder="Cédula del cliente" inputmode="numeric">
    <button id="abrir" title="Abrir chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
  </div>
  <div id="chat"><div class="vacio">Ingresa la cédula para ver el chat</div></div>
  <div class="escribiendo" id="escribiendo"></div>
  <div class="barra">
    <input id="texto" placeholder="Mensaje">
    <button id="enviar" title="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
    </button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let cedula = new URLSearchParams(location.search).get("cedula") || "", vistos = 0, sondeo = null, ocupado = false;

function pintar(mensajes) {
  const chat = $("chat");
  if (!mensajes.length) { chat.innerHTML = '<div class="vacio">Sin mensajes todavía</div>'; vistos = 0; return; }
  if (vistos === 0) chat.innerHTML = "";
  mensajes.slice(vistos).forEach(m => {
    const b = document.createElement("div");
    b.className = "b nuevo " + m.rol;
    const seguro = m.texto.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    b.innerHTML = seguro.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    const h = document.createElement("span"); h.className = "hora"; h.textContent = m.hora;
    b.appendChild(h); chat.appendChild(b);
  });
  vistos = mensajes.length;
  chat.scrollTop = chat.scrollHeight;
}

async function actualizar() {
  if (!cedula) return;
  const r = await fetch(`/whatsapp/${cedula}/mensajes`);
  if (r.ok) pintar(await r.json());
}

function abrir() {
  cedula = $("cedula").value.trim();
  vistos = 0; $("chat").innerHTML = "";
  history.replaceState(null, "", "?cedula=" + cedula);
  clearInterval(sondeo); actualizar(); sondeo = setInterval(actualizar, 3000);
}

async function enviar() {
  const texto = $("texto").value.trim();
  if (!texto || !cedula || ocupado) return;
  ocupado = true; $("texto").value = "";
  const b = document.createElement("div");           // mostrar el mensaje propio de inmediato
  b.className = "b nuevo user"; b.textContent = texto;
  if ($("chat").querySelector(".vacio")) $("chat").innerHTML = "";
  $("chat").appendChild(b); $("chat").scrollTop = $("chat").scrollHeight;
  $("escribiendo").textContent = "escribiendo...";
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cedula, mensaje: texto, canal: "whatsapp" }) });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(typeof d.detail === "string" ? d.detail : "Error del servidor");
    }
    vistos = 0; $("chat").innerHTML = ""; await actualizar();
  } catch (e) {
    const err = document.createElement("div");
    err.className = "b assistant"; err.style.color = "#f87171";
    err.textContent = "No se pudo enviar. " + e.message;
    $("chat").appendChild(err); $("chat").scrollTop = $("chat").scrollHeight;
  } finally {
    $("escribiendo").textContent = ""; ocupado = false;
  }
}

$("abrir").onclick = abrir;
$("cedula").onkeydown = e => { if (e.key === "Enter") abrir(); };
$("enviar").onclick = enviar;
$("texto").onkeydown = e => { if (e.key === "Enter") enviar(); };
if (cedula) { $("cedula").value = cedula; abrir(); }
</script>
</body>
</html>
