<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat con el agente</title>
<style>
  :root { --bg:#0b0d12; --card:#14171f; --line:#262a35; --txt:#e7e9ee; --sub:#8b919d; --acc:#4f46e5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter","Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--txt);
         display:flex; justify-content:center; padding:32px 16px; }
  .card { width:100%; max-width:640px; height:calc(100vh - 64px); background:var(--card); border:1px solid var(--line);
          border-radius:16px; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  h1 { margin:0; font-size:1.1rem; font-weight:600; } .sub { color:var(--sub); font-size:.8rem; margin-top:2px; }
  #quien { font-size:.8rem; color:var(--sub); }
  #login { padding:22px; display:flex; gap:10px; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--bg);
          color:var(--txt); font-size:.95rem; outline:none; }
  input:focus { border-color:var(--acc); }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--acc); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #log { flex:1; overflow-y:auto; padding:18px 22px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 14px; border-radius:12px; max-width:85%; line-height:1.45; font-size:.92rem; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#232a3d; }
  .assistant { align-self:flex-start; background:#1b1f2a; border:1px solid var(--line); }
  .error { color:#f87171; }
  .tools { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; font-size:.72rem; color:var(--sub); align-items:center; }
  .tag { font-family:ui-monospace,monospace; border:1px solid var(--line); border-radius:6px; padding:2px 6px; }
  #barra { padding:14px 22px; border-top:1px solid var(--line); display:none; gap:10px; }
  #estado { font-size:.78rem; color:var(--sub); padding:0 22px 8px; min-height:1.2em; }
  .aviso { color:#f87171; font-size:.85rem; padding:0 22px; }
</style>
</head>
<body>
<div class="card">
  <header>
    <div><h1>Chat con el agente</h1><div class="sub">Atención por canal web</div></div>
    <div id="quien"></div>
  </header>
  <div id="login">
    <input id="cedula" placeholder="Número de cédula registrada" inputmode="numeric">
    <button id="entrar">Entrar</button>
  </div>
  <div id="registro" style="display:none;padding:0 22px 16px;gap:10px;flex-wrap:wrap">
    <input id="nombre" placeholder="Nombre completo">
    <input id="telefono" placeholder="Celular" inputmode="numeric">
    <button id="registrar">Registrarme</button>
  </div>
  <div class="aviso" id="aviso"></div>
  <div id="log"></div>
  <div id="estado"></div>
  <div id="barra">
    <input id="texto" placeholder="Escribe tu mensaje">
    <button id="enviar">Enviar</button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let cedula = "", ocupado = false;

function agregar(rol, texto, herramientas = [], error = false) {
  const d = document.createElement("div");
  d.className = "msg " + rol + (error ? " error" : "");
  d.textContent = texto.replace(/\*\*(.+?)\*\*/g, "$1");
  const nombres = herramientas.map(h => (h.match(/([a-z_]+)\(/) || [])[1]).filter(Boolean);
  if (nombres.length) {
    const t = document.createElement("div");
    t.className = "tools"; t.append("Consultas:");
    nombres.forEach(n => { const s = document.createElement("span"); s.className = "tag"; s.textContent = n; t.append(s); });
    d.appendChild(t);
  }
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

async function entrar() {
  $("aviso").textContent = "";
  const ced = $("cedula").value.trim();
  const r = await fetch(`/clientes/${ced}/historial`);
  if (!r.ok) {
    $("aviso").textContent = "No encontramos esa cédula. Regístrate para continuar.";
    $("registro").style.display = "flex";
    $("nombre").focus();
    return;
  }
  cedula = ced;
  (await r.json()).forEach(m => agregar(m.rol, m.texto, m.herramientas));
  $("login").style.display = "none";
  $("barra").style.display = "flex";
  $("quien").textContent = "Cédula " + cedula;
  $("texto").focus();
}

async function registrar() {
  const body = { cedula: $("cedula").value.trim(), nombre: $("nombre").value.trim(),
                 telefono: $("telefono").value.trim() || null };
  if (!body.nombre) { $("aviso").textContent = "Escribe tu nombre."; return; }
  const r = await fetch("/clientes", { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify(body) });
  if (!r.ok) { $("aviso").textContent = "Datos inválidos: la cédula debe tener entre 5 y 12 dígitos."; return; }
  $("registro").style.display = "none";
  entrar();
}

async function enviar() {
  const texto = $("texto").value.trim();
  if (!texto || ocupado) return;
  ocupado = true; $("enviar").disabled = true; $("texto").value = "";
  agregar("user", texto);
  $("estado").textContent = "El agente está procesando tu solicitud...";
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cedula, mensaje: texto, canal: "web" }) });
    const d = await r.json();
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Error del servidor");
    agregar("assistant", d.respuesta, d.herramientas);
  } catch (e) {
    agregar("assistant", "No fue posible procesar la solicitud. " + e.message, [], true);
  } finally {
    $("estado").textContent = ""; ocupado = false; $("enviar").disabled = false; $("texto").focus();
  }
}

$("entrar").onclick = entrar;
$("registrar").onclick = registrar;
$("cedula").onkeydown = e => { if (e.key === "Enter") entrar(); };
$("enviar").onclick = enviar;
$("texto").onkeydown = e => { if (e.key === "Enter") enviar(); };
</script>
</body>
</html>
